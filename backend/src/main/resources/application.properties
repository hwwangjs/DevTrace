spring.application.name=devtrace-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devtrace}
spring.datasource.username=${DB_USERNAME:devtrace_user}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
server.port=${PORT:8080}
devtrace.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.tracking-modes=cookie
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO

openai.model=${OPENAI_MODEL:gpt-6-luna}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:45}
